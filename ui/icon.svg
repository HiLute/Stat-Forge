<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Раскалённый кубик: тёмный металл в цвет интерфейса, снизу нагрет
       докрасна, рёбра и точки светятся. Изометрия: верхняя грань «1»,
       левая «2», правая «3». -->
  <defs>
    <!-- Жар вокруг кубика. -->
    <radialGradient id="halo" cx="128" cy="132" r="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a1c" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c22410" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c22410" stop-opacity="0"/>
    </radialGradient>

    <!-- Грани: сверху остывший металл, книзу — красный и оранжевый жар. -->
    <linearGradient id="top" x1="128" y1="40" x2="128" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2a2e"/>
      <stop offset="1" stop-color="#4a2a26"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="96" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26252a"/>
      <stop offset="0.45" stop-color="#4c1f1a"/>
      <stop offset="0.8" stop-color="#9a2a12"/>
      <stop offset="1" stop-color="#e0541c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="96" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1d21"/>
      <stop offset="0.45" stop-color="#3e1915"/>
      <stop offset="0.8" stop-color="#82220f"/>
      <stop offset="1" stop-color="#c8441a"/>
    </linearGradient>

    <!-- Рёбра раскалены сильнее снизу. -->
    <linearGradient id="edge" x1="0" y1="40" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9b36c"/>
      <stop offset="0.5" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>

    <!-- Точка-уголёк: золотой центр, оранжевый край. -->
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.35" stop-color="#ffc35a"/>
      <stop offset="0.75" stop-color="#ff6a1e"/>
      <stop offset="1" stop-color="#c22410"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="pip-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.05"/>
    </filter>
  </defs>

  <!-- Жар вписан в холст, чтобы его край не обрезался. -->
  <circle cx="128" cy="132" r="124" fill="url(#halo)"/>

  <!-- Кубик увеличен, чтобы заполнять иконку в малых размерах. -->
  <g transform="translate(128 136) scale(1.2) translate(-128 -136)">

  <!-- Грани. -->
  <polygon points="128,40 212,88 128,136 44,88" fill="url(#top)"/>
  <polygon points="44,88 128,136 128,232 44,184" fill="url(#left)"/>
  <polygon points="128,136 212,88 212,184 128,232" fill="url(#right)"/>

  <!-- Свечение рёбер (размытая копия) и сами рёбра. -->
  <g fill="none" stroke="#ff5a1e" stroke-width="7" stroke-linejoin="round" filter="url(#glow)" opacity="0.8">
    <polygon points="128,40 212,88 212,184 128,232 44,184 44,88"/>
    <polyline points="44,88 128,136 212,88"/>
    <line x1="128" y1="136" x2="128" y2="232"/>
  </g>
  <g fill="none" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="128,40 212,88 212,184 128,232 44,184 44,88"/>
    <polyline points="44,88 128,136 212,88"/>
    <line x1="128" y1="136" x2="128" y2="232"/>
  </g>

  <!-- Точки рисуются в единичном квадрате и проецируются на грань. -->
  <!-- Верхняя грань: 1. -->
  <g transform="matrix(84 -48 84 48 44 88)">
    <circle cx="0.5" cy="0.5" r="0.2" fill="#ff5a1e" opacity="0.6" filter="url(#pip-glow)"/>
    <circle cx="0.5" cy="0.5" r="0.14" fill="url(#ember)"/>
  </g>
  <!-- Левая грань: 2. -->
  <g transform="matrix(84 48 0 96 44 88)">
    <circle cx="0.28" cy="0.28" r="0.15" fill="#ff5a1e" opacity="0.55" filter="url(#pip-glow)"/>
    <circle cx="0.72" cy="0.72" r="0.15" fill="#ff5a1e" opacity="0.55" filter="url(#pip-glow)"/>
    <circle cx="0.28" cy="0.28" r="0.1" fill="url(#ember)"/>
    <circle cx="0.72" cy="0.72" r="0.1" fill="url(#ember)"/>
  </g>
  <!-- Правая грань: 3. -->
  <g transform="matrix(84 -48 0 96 128 136)">
    <circle cx="0.28" cy="0.28" r="0.15" fill="#ff5a1e" opacity="0.55" filter="url(#pip-glow)"/>
    <circle cx="0.5" cy="0.5" r="0.15" fill="#ff5a1e" opacity="0.55" filter="url(#pip-glow)"/>
    <circle cx="0.72" cy="0.72" r="0.15" fill="#ff5a1e" opacity="0.55" filter="url(#pip-glow)"/>
    <circle cx="0.28" cy="0.28" r="0.1" fill="url(#ember)"/>
    <circle cx="0.5" cy="0.5" r="0.1" fill="url(#ember)"/>
    <circle cx="0.72" cy="0.72" r="0.1" fill="url(#ember)"/>
  </g>
  </g>
</svg>
